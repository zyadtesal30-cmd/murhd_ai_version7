name: Build Murshid APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel
          pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Verify project files
        run: |
          for f in buildozer.spec main.py engine.py ui.py tabs_a.py tabs_b.py fonts/DejaVuSansCondensed.ttf fonts/DejaVuSansCondensed-Bold.ttf; do
            test -f "$f" || { echo "ERROR: missing $f"; exit 1; }
          done
          echo "All project files found"

      - name: Fetch modern Arabic font (optional)
        run: |
          pip install fonttools
          python tools/get_font.py || echo "Using bundled font"
          ls -la fonts

      - name: Fetch OCR language data (Arabic + English)
        run: |
          mkdir -p tessdata
          for l in ara eng; do
            curl -fL --retry 3 -o tessdata/$l.traineddata "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata" || echo "WARN: $l failed"
          done
          ls -la tessdata
          test -s tessdata/ara.traineddata || echo "WARNING: Arabic OCR data missing - image input will show an error"

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build Android APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show root cause (only on failure)
        if: failure()
        run: |
          echo "===== أسطر الخطأ الحقيقية ====="
          grep -n -i -E "What went wrong|Execution failed|requires libraries|Could not (resolve|find|get)|Manifest merger|Duplicate class|error:|Exception|FAILURE" build.log | head -60 || true
          echo "===== آخر 150 سطر ====="
          tail -n 150 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Murshid-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
